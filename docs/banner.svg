<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ignition Zero banner">
  <defs>
    <radialGradient id="ember" cx="0.32" cy="0.55" r="0.55">
      <stop offset="0" stop-color="#3a0e05"/>
      <stop offset="1" stop-color="#0c0503"/>
    </radialGradient>
    <radialGradient id="kernel" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="0.45" stop-color="#ff8a3c"/>
      <stop offset="0.8" stop-color="#c0392b" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#c0392b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#ember)"/>
  <!-- ignition kernel on LEFT -->
  <g transform="translate(100,150)">
    <circle cx="0" cy="0" r="110" fill="url(#kernel)"/>
    <!-- spark rays -->
    <g stroke="#ffb066" stroke-width="2.5" opacity="0.8">
      <line x1="70" y1="-88" x2="96" y2="-120"/>
      <line x1="105" y1="-20" x2="142" y2="-26"/>
      <line x1="88" y1="62" x2="118" y2="88"/>
      <line x1="-30" y1="108" x2="-38" y2="144"/>
      <line x1="-100" y1="-50" x2="-132" y2="-66"/>
    </g>
    <!-- rising Y depletion arrow -->
    <text x="-6" y="-128" fill="#d8c9b8" font-family="Consolas, monospace" font-size="15" text-anchor="middle">Y ↓ fuel</text>
    <text x="-6" y="140" fill="#ffd97a" font-family="Consolas, monospace" font-size="15" text-anchor="middle">T ↑ runaway</text>
    <text x="0" y="8" fill="#fff3d8" font-family="Consolas, monospace" font-size="16" text-anchor="middle">k(T) = A·e^(−Ea/RT)</text>
  </g>
  <!-- wordmark RIGHT -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="560" y="120" fill="#ffffff" font-size="60" font-weight="800" letter-spacing="1">Ignition <tspan fill="#ff8a3c">Zero</tspan></text>
    <text x="562" y="164" fill="#d8c9b8" font-size="21">0-D reacting kinetics &amp; energy balances in native C++</text>
    <text x="562" y="202" fill="#a08868" font-family="Consolas, monospace" font-size="15">invariant cₚT + qY conserved to roundoff through runaway</text>
  </g>
</svg>
